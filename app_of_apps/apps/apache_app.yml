apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apache-root-child
  namespace: argocd
spec:
  project: root-team
  source:
    repoURL: https://github.com/SanjanaMahapatra/argocd-demos.git
    targetRevision: main
    path: cli_approach/apache
  destination:
    server: https://172.31.16.61:33893
    namespace: root
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
